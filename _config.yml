# Configurations
title:            Obrada dostavljenih podataka - UQ regulacija na sučelju u HE Zakučac
longtitle:        Obrada dostavljenih podataka - UQ regulacija na sučelju u HE Zakučac
short_title:      UQ regulacija · HE Zakučac
author:           admilara
email:            lara.buljan@ie-zagreb.hr
github_username:  admilara
description: >
  Rezultati obrade Watch zapisa sustava uzbude i PROCIS zapisa s pokusa regulacije
  napona i jalove snage na sučelju HE Zakučac s prijenosnom mrežom (21.02. i 05.03.2025.).

version:          1.0
gitbook_version:  1.0

url:              'https://admilara.github.io'
baseurl:          '/zakucac-uq'
rss:              RSS

# bootstrap: use the remote theme for the site itself
remote_theme: sighingnow/jekyll-gitbook

toc:
  enabled: true
  h_min:   1
  h_max:   5

# customize the link favicon in header, will be {{site.baseurl}}/{{site.favicon_path}}
favicon_path:     /assets/gitbook/images/favicon.ico

# markdown render engine.
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: colorful

markdown_ext:             markdown,mkdown,mkdn,mkd,md

# Permalinks
permalink:                /:name/

# Disqus comments
# disqushandler:            sighingnow

exclude:
  - _drafts
  - README.md
  - Gemfile
  - LICENSE

collections:
  pages:
    output: true
    permalink: /:collection/:path/

ordered_collections:
  - posts
  - pages

page_width: 800px

# Watch/PROCIS record pages live in plain folders (not collections), so they are not in the
# sidebar. This maps each folder to its overview post: the post is highlighted in the sidebar,
# a back link is shown above the title, and the < > arrows step through the folder's records.
record_sections:
  - dir: /watch-md-a/
    parent_url: /2025-03-19-watch-inem-agr-a/
    parent_title: Agregat A - Watch datoteke
  - dir: /watch-md-d/
    parent_url: /2025-03-24-watch-inem-agr-d/
    parent_title: Agregat D - Watch datoteke
  - dir: /hrvoje-procis-md/
    parent_url: /2025-04-16-procis/
    parent_title: Agregati A i D - PROCIS

destination:      ./_site
incremental:      false
regenerate:       true

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jemoji
